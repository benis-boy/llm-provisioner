openapi: 3.0.3
info:
  title: LLM Queue and Resource Manager
  version: 0.1.0
  description: >-
    Implemented Resource Manager shared-storage binding plus retained Phase 0
    scheduler, provisioning, health, and metrics target contracts. Operations
    marked x-implementation: future are documented targets, not HTTP adapters.
servers: [{url: http://127.0.0.1:8080}]
tags: [{name: scheduler}, {name: resource-manager}, {name: provisioning}, {name: health}]
paths:
  /schedulers/{schedulerId}/start:
    post: {tags: [scheduler], operationId: startScheduler, parameters: [{$ref: '#/components/parameters/SchedulerId'}, {$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/StartRequest'}, responses: {'200': {$ref: '#/components/responses/FutureSession'}, '400': {$ref: '#/components/responses/FutureError'}, '404': {$ref: '#/components/responses/FutureError'}, '409': {$ref: '#/components/responses/FutureError'}, '413': {$ref: '#/components/responses/FutureError'}, '500': {$ref: '#/components/responses/FutureError'}}}
  /schedulers/{schedulerId}/requests:
    post: {tags: [scheduler], operationId: enqueue, parameters: [{$ref: '#/components/parameters/SchedulerId'}, {$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/EnqueueRequest'}, responses: {'201': {$ref: '#/components/responses/FutureRequest'}, '400': {$ref: '#/components/responses/FutureError'}, '404': {$ref: '#/components/responses/FutureError'}, '409': {$ref: '#/components/responses/FutureError'}, '413': {$ref: '#/components/responses/FutureError'}, '500': {$ref: '#/components/responses/FutureError'}}}
  /schedulers/{schedulerId}/requests/{requestId}:
    get: {tags: [scheduler], operationId: getRequest, parameters: [{$ref: '#/components/parameters/SchedulerId'}, {$ref: '#/components/parameters/RequestId'}], responses: {'200': {$ref: '#/components/responses/FutureRequest'}, '404': {$ref: '#/components/responses/FutureError'}}}
  /schedulers/{schedulerId}/requests/{requestId}/watch:
    get: {tags: [scheduler], operationId: watchRequest, parameters: [{$ref: '#/components/parameters/SchedulerId'}, {$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/LastEventId'}], responses: {'200': {$ref: '#/components/responses/FutureSse'}, '400': {$ref: '#/components/responses/FutureError'}, '404': {$ref: '#/components/responses/FutureError'}, '409': {$ref: '#/components/responses/FutureError'}, '413': {$ref: '#/components/responses/FutureError'}, '429': {$ref: '#/components/responses/FutureError'}, '500': {$ref: '#/components/responses/FutureError'}}}
  /schedulers/{schedulerId}/requests/{requestId}/cancel:
    post: {tags: [scheduler], operationId: cancelSchedulerRequest, parameters: [{$ref: '#/components/parameters/SchedulerId'}, {$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/IdempotencyKey'}], responses: {'200': {$ref: '#/components/responses/FutureRequest'}, '404': {$ref: '#/components/responses/FutureError'}, '409': {$ref: '#/components/responses/FutureError'}}}
  /schedulers/{schedulerId}/stop:
    post: {tags: [scheduler], operationId: stopScheduler, parameters: [{$ref: '#/components/parameters/SchedulerId'}, {$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/StopRequest'}, responses: {'200': {$ref: '#/components/responses/SchedulerStop'}, '400': {$ref: '#/components/responses/FutureError'}, '409': {$ref: '#/components/responses/FutureError'}}}
  /resource-manager/sessions:
    post: {tags: [resource-manager], operationId: startSession, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/StartSessionRequest'}, responses: {'201': {$ref: '#/components/responses/RMSession'}, default: {$ref: '#/components/responses/RMError'}}}
  /resource-manager/sessions/{sessionToken}/submissions:
    post: {tags: [resource-manager], operationId: submit, parameters: [{$ref: '#/components/parameters/SessionToken'}, {$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/SubmitRequest'}, responses: {'202': {$ref: '#/components/responses/RMSubmission'}, '429': {$ref: '#/components/responses/RMSubmission'}, default: {$ref: '#/components/responses/RMError'}}}
  /resource-manager/sessions/{sessionToken}/requests/{requestId}/cancel:
    post: {tags: [resource-manager], operationId: cancelResourceRequest, parameters: [{$ref: '#/components/parameters/SessionToken'}, {$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/IdempotencyKey'}], responses: {'200': {$ref: '#/components/responses/RMAck'}, default: {$ref: '#/components/responses/RMError'}}}
  /resource-manager/sessions/{sessionToken}/stop:
    post: {tags: [resource-manager], operationId: stopSession, parameters: [{$ref: '#/components/parameters/SessionToken'}, {$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/RMStopRequest'}, responses: {'202': {$ref: '#/components/responses/RMAck'}, default: {$ref: '#/components/responses/RMError'}}}
  /resource-manager/sessions/{sessionToken}/capacity:
    get: {tags: [resource-manager], operationId: getSessionCapacity, parameters: [{$ref: '#/components/parameters/SessionToken'}], responses: {'200': {$ref: '#/components/responses/RMCapacity'}, default: {$ref: '#/components/responses/RMError'}}}
  /resource-manager/sessions/{sessionToken}/watch:
    get: {tags: [resource-manager], operationId: watchProgress, parameters: [{$ref: '#/components/parameters/SessionToken'}, {$ref: '#/components/parameters/LastEventId'}], responses: {'200': {$ref: '#/components/responses/RMSse'}, default: {$ref: '#/components/responses/RMError'}}}
  /resource-manager/capacity:
    get: {x-implementation: future, tags: [resource-manager], operationId: getCapacity, responses: {'200': {$ref: '#/components/responses/FutureCapacity'}, default: {$ref: '#/components/responses/FutureError'}}}
  /provisioning/verify-artifacts:
    post: {tags: [provisioning], operationId: verifyArtifacts, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/ArtifactVerificationRequest'}, responses: {'200': {$ref: '#/components/responses/ArtifactVerification'}, '400': {$ref: '#/components/responses/FutureError'}, '404': {$ref: '#/components/responses/FutureError'}, '413': {$ref: '#/components/responses/FutureError'}, '422': {$ref: '#/components/responses/FutureError'}, '429': {$ref: '#/components/responses/FutureError'}, '504': {$ref: '#/components/responses/FutureError'}}}
  /provisioning/measure-capacity:
    post: {x-implementation: future, tags: [provisioning], operationId: measureCapacity, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/ProvisionRequest'}, responses: {'202': {$ref: '#/components/responses/FutureAck'}, default: {$ref: '#/components/responses/FutureError'}}}
  /provisioning/validate-profile:
    post: {tags: [provisioning], operationId: validateProfile, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/ProfileRequest'}, responses: {'200': {$ref: '#/components/responses/FutureAck'}, '400': {$ref: '#/components/responses/FutureError'}, '413': {$ref: '#/components/responses/FutureError'}, '422': {$ref: '#/components/responses/FutureError'}, '429': {$ref: '#/components/responses/FutureError'}, '504': {$ref: '#/components/responses/FutureError'}}}
  /health/live:
    get: {tags: [health], operationId: healthLive, responses: {'200': {$ref: '#/components/responses/HealthLive'}}}
  /health/ready:
    get: {tags: [health], operationId: healthReady, responses: {'200': {$ref: '#/components/responses/HealthReady'}, '503': {$ref: '#/components/responses/HealthReady'}}}
  /health/dependencies:
    get: {tags: [health], operationId: healthDependencies, responses: {'200': {$ref: '#/components/responses/HealthDependencies'}}}
  /metrics:
    get: {x-implementation: future, tags: [health], operationId: metrics, responses: {'200': {description: Metrics, content: {text/plain: {schema: {type: string}}}}}}
components:
  parameters:
    SchedulerId: {name: schedulerId, in: path, required: true, schema: {type: string, minLength: 1}}
    RequestId: {name: requestId, in: path, required: true, schema: {type: string, minLength: 1}}
    SessionToken: {name: sessionToken, in: path, required: true, schema: {type: string, minLength: 1}}
    AttemptToken: {name: Attempt-Token, in: header, required: true, schema: {type: string, minLength: 1}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1}}
    LastEventId: {name: Last-Event-ID, in: header, required: false, schema: {type: string, pattern: '^[0-9]+$'}}
  requestBodies:
    StartRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Start'}}}}
    EnqueueRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Enqueue'}}}}
    StopRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Stop'}}}}
    StartSessionRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RMStartSession'}}}}
    SubmitRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RMSubmit'}}}}
    RMStopRequest: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/RMStop'}}}}
    ProvisionRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Provision'}}}}
    ArtifactVerificationRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ArtifactVerificationRequest'}}}}
    ProfileRequest: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProfileValidationRequest'}}}}
  responses:
    FutureRequest: {description: Future request, content: {application/json: {schema: {$ref: '#/components/schemas/Request'}}}}
    FutureSession: {description: Future session, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
    FutureAck: {description: Future acknowledgement, content: {application/json: {schema: {$ref: '#/components/schemas/Ack'}}}}
    SchedulerStop: {description: Scheduler stop acknowledgement, content: {application/json: {schema: {$ref: '#/components/schemas/SchedulerStop'}}}}
    FutureCapacity: {description: Future capacity, content: {application/json: {schema: {$ref: '#/components/schemas/Capacity'}}}}
    FutureHealth: {description: Future health, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
    HealthLive: {description: Process liveness, content: {application/json: {schema: {$ref: '#/components/schemas/HealthLive'}}}}
    HealthReady: {description: Readiness, content: {application/json: {schema: {$ref: '#/components/schemas/HealthReady'}}}}
    HealthDependencies: {description: Bounded dependency diagnostics, content: {application/json: {schema: {$ref: '#/components/schemas/HealthDependencies'}}}}
    FutureSse: {description: Future SSE, content: {text/event-stream: {schema: {$ref: '#/components/schemas/SseEnvelope'}}}}
    FutureError: {description: Future error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ArtifactVerification: {description: Selected artifact integrity result, content: {application/json: {schema: {$ref: '#/components/schemas/ArtifactVerification'}}}}
    RMSession: {description: RM session, content: {application/json: {schema: {$ref: '#/components/schemas/RMSession'}}}}
    RMSubmission: {description: RM submission or capacity_backpressure (accepted false), content: {application/json: {schema: {$ref: '#/components/schemas/RMSubmission'}}}}
    RMAck: {description: RM acknowledgement, content: {application/json: {schema: {$ref: '#/components/schemas/RMAck'}}}}
    RMCapacity: {description: RM capacity, content: {application/json: {schema: {$ref: '#/components/schemas/RMCapacity'}}}}
    RMSse: {description: RM SSE progress, content: {text/event-stream: {schema: {$ref: '#/components/schemas/RMProgressEvent'}}}}
    RMError: {description: RM error, content: {application/json: {schema: {$ref: '#/components/schemas/RMError'}}}}
  schemas:
    ModelId: {type: string, enum: [SmolLM, CoEdIT, GECToR]}
    Status: {type: string, enum: [scheduled, running, on_gpu, done, error, cancelled]}
    Start: {type: object, additionalProperties: false, required: [schedulerId, modelId], properties: {schedulerId: {type: string, minLength: 1}, modelId: {$ref: '#/components/schemas/ModelId'}}}
    FunctionDescriptor: {type: object, additionalProperties: false, required: [name, args, dependencyResultIds], properties: {name: {type: string, minLength: 1}, args: {type: object, additionalProperties: true}, dependencyResultIds: {type: array, items: {type: string}}}}
    Enqueue: {type: object, additionalProperties: false, required: [schedulerId, requestId, modelId, payloadReference], properties: {schedulerId: {type: string, minLength: 1}, requestId: {type: string}, modelId: {$ref: '#/components/schemas/ModelId'}, payloadReference: {type: string}, dependencies: {type: array, items: {type: string}}, insertionMode: {type: string, enum: [append, skip-line]}, ready: {$ref: '#/components/schemas/FunctionDescriptor'}, template: {$ref: '#/components/schemas/FunctionDescriptor'}, resultTarget: {type: string}}}
    Stop: {type: object, additionalProperties: false, required: [outcome], properties: {outcome: {type: string, enum: [error, cancelled]}, reason: {type: string}}}
    Provision: {type: object, additionalProperties: false, required: [modelId, parentPath, modelFile, resourceManagerType], properties: {modelId: {$ref: '#/components/schemas/ModelId'}, parentPath: {type: string}, modelFile: {type: string}, resourceManagerType: {type: string, enum: [ollama, transformers-coedit, gector]}, contextSizeEstimates: {type: array, items: {type: integer, minimum: 1}}, buckets: {type: array, items: {$ref: '#/components/schemas/Bucket'}}, benchmarkRequests: {type: array, items: {type: string}}}}
    ArtifactVerificationRequest: {type: object, additionalProperties: false, required: [volumeId], properties: {volumeId: {type: string, minLength: 1}, expectedManifestSha256: {type: string, pattern: '^[0-9a-f]{64}$'}}}
    ArtifactVerification: {type: object, additionalProperties: false, required: [volumeId, manifestSha256, models, verified, verificationScope], properties: {volumeId: {type: string, minLength: 1}, manifestSha256: {type: string, pattern: '^[0-9a-f]{64}$'}, models: {type: array, items: {$ref: '#/components/schemas/ArtifactModelSummary'}}, verified: {type: boolean, enum: [true]}, verificationScope: {type: string, enum: [selected-file-integrity]}}}
    ArtifactModelSummary: {type: object, additionalProperties: false, required: [modelId, fileCount, totalBytes], properties: {modelId: {$ref: '#/components/schemas/ModelId'}, fileCount: {type: integer, minimum: 0}, totalBytes: {type: integer, minimum: 0}}}
    Bucket: {type: object, additionalProperties: false, required: [maxInputTokens, maxOutputTokens, generation, nativeBatchShape], properties: {maxInputTokens: {type: integer, minimum: 1}, maxOutputTokens: {type: integer, minimum: 1}, generation: {$ref: '#/components/schemas/Generation'}, nativeBatchShape: {type: array, items: {type: integer, minimum: 1}}, maxIterations: {type: integer, minimum: 1}, thresholds: {type: array, items: {type: number, minimum: 0, maximum: 1}}}}
    Generation: {type: object, additionalProperties: false, required: [parameters, dtype], properties: {parameters: {type: object, additionalProperties: true}, dtype: {type: string, minLength: 1}}}
    Profile: {type: object, additionalProperties: false, required: [modelId, gpuUuid, artifactManifestHash, modelHash, runtimeIdentity, adapterIdentity, profileIdentity, optimalParallelism, memorySafeN, bufferCapacity, safetyReservePercent, rawSamples], properties: {modelId: {$ref: '#/components/schemas/ModelId'}, gpuUuid: {type: string, minLength: 1}, artifactManifestHash: {type: string, minLength: 1}, modelHash: {type: string, minLength: 1}, runtimeIdentity: {type: string, minLength: 1}, adapterIdentity: {type: string, minLength: 1}, profileIdentity: {type: string, minLength: 1}, optimalParallelism: {type: integer, minimum: 1}, memorySafeN: {type: integer, minimum: 1}, bufferCapacity: {type: integer, minimum: 1}, safetyReservePercent: {type: integer, minimum: 0, maximum: 100}, contextSize: {type: integer, minimum: 1}, bucketIdentity: {type: string, minLength: 1}, rawSamples: {type: array, items: {$ref: '#/components/schemas/Sample'}}}}
    ProfileValidationRequest: {allOf: [{$ref: '#/components/schemas/Profile'}, {oneOf: [{required: [contextSize], not: {required: [bucketIdentity]}, properties: {modelId: {enum: [SmolLM]}}}, {required: [bucketIdentity], not: {required: [contextSize]}, properties: {modelId: {enum: [CoEdIT, GECToR]}}}]}]}
    Sample: {type: object, additionalProperties: false, required: [concurrency, wave, successfulRequests, wallTimeMs, peakVramBytes, latencyMs], properties: {concurrency: {type: integer, minimum: 1}, wave: {type: integer, minimum: 0}, successfulRequests: {type: integer, minimum: 0}, wallTimeMs: {type: integer, minimum: 0}, peakVramBytes: {type: integer, minimum: 0}, latencyMs: {type: array, items: {type: integer, minimum: 0}}}}
    Session: {type: object, additionalProperties: false, required: [sessionToken, schedulerId, modelId, residencyGeneration], properties: {sessionToken: {type: string}, schedulerId: {type: string}, modelId: {$ref: '#/components/schemas/ModelId'}, residencyGeneration: {type: integer, minimum: 0}}}
    Request: {type: object, additionalProperties: false, required: [requestId, schedulerId, modelId, status, sequence, runningAt, doneAt, runningToDoneMs, timeOnGpuMs, gpuTimingComplete, errorCode, resultReference, cancellation], properties: {requestId: {type: string}, schedulerId: {type: string}, modelId: {$ref: '#/components/schemas/ModelId'}, status: {$ref: '#/components/schemas/Status'}, sequence: {type: integer, minimum: 0}, runningAt: {type: number, nullable: true}, doneAt: {type: number, nullable: true}, runningToDoneMs: {type: integer, minimum: 0, nullable: true}, timeOnGpuMs: {type: integer, minimum: 0, nullable: true}, gpuTimingComplete: {type: boolean}, errorCode: {type: string, nullable: true}, resultReference: {type: string, nullable: true}, cancellation: {type: boolean}}}
    Capacity: {type: object, additionalProperties: false, required: [modelId, optimalParallelism, bufferCapacity, admissionLimit, profileIdentity], properties: {modelId: {$ref: '#/components/schemas/ModelId'}, optimalParallelism: {type: integer, minimum: 1}, bufferCapacity: {type: integer, minimum: 1}, admissionLimit: {type: integer, minimum: 1}, profileIdentity: {type: string}}}
    SseEnvelope: {type: object, additionalProperties: false, required: [id, event, data], properties: {id: {type: string, pattern: '^[0-9]+$'}, event: {type: string, minLength: 1}, data: {$ref: '#/components/schemas/Request'}}}
    Progress: {type: object, additionalProperties: false, required: [requestId, status, sequence], properties: {requestId: {type: string}, status: {$ref: '#/components/schemas/Status'}, sequence: {type: integer, minimum: 0}, message: {type: string}}}
    Ack: {type: object, additionalProperties: false, required: [accepted, operationId], properties: {accepted: {type: boolean}, operationId: {type: string}}}
    SchedulerStop: {type: object, additionalProperties: false, required: [accepted, cancelled, affected], properties: {accepted: {type: boolean, enum: [true]}, cancelled: {type: boolean}, affected: {type: integer, minimum: 0}}}
    Backpressure: {type: object, additionalProperties: false, required: [code, retryable], properties: {code: {type: string, enum: [capacity_backpressure]}, retryable: {type: boolean, enum: [false]}}}
    Health: {type: object, additionalProperties: false, required: [ready, details], properties: {ready: {type: boolean}, details: {type: object, additionalProperties: false, properties: {sqlite: {type: boolean}, gpu: {type: boolean}, artifacts: {type: boolean}, profile: {type: boolean}, cleanup: {type: boolean}}}}}
    HealthLive: {type: object, additionalProperties: false, required: [live], properties: {live: {type: boolean, enum: [true]}}}
    HealthReason: {oneOf: [{type: object, additionalProperties: false, required: [phase], properties: {phase: {type: string, enum: [startup, provisioning, loading, unloading, profile_mismatch, profile_unproved, cleanup_failed, state_malformed]}}}, {type: object, additionalProperties: false, required: [dependency, reason], properties: {dependency: {type: string, enum: [sqlite, gpu, artifacts, adapter, ollama, profile, cleanup]}, reason: {type: string, enum: [unavailable, probe_timeout, probe_failed, state_missing, state_malformed, overloaded]}}}]}
    HealthReady: {type: object, additionalProperties: false, required: [ready, reasons], properties: {ready: {type: boolean}, reasons: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/HealthReason'}}}}
    HealthDependency: {type: object, additionalProperties: false, required: [ok, reason], properties: {ok: {type: boolean}, reason: {type: string, enum: [ok, unavailable, probe_timeout, probe_failed, state_missing, state_malformed, overloaded]}}}
    HealthDependencies: {type: object, additionalProperties: false, required: [dependencies], properties: {dependencies: {type: object, additionalProperties: false, required: [sqlite, gpu, artifacts, adapter, ollama, profile, cleanup], properties: {sqlite: {$ref: '#/components/schemas/HealthDependency'}, gpu: {$ref: '#/components/schemas/HealthDependency'}, artifacts: {$ref: '#/components/schemas/HealthDependency'}, adapter: {$ref: '#/components/schemas/HealthDependency'}, ollama: {$ref: '#/components/schemas/HealthDependency'}, profile: {$ref: '#/components/schemas/HealthDependency'}, cleanup: {$ref: '#/components/schemas/HealthDependency'}}}}}
    Error: {type: object, additionalProperties: false, required: [code, message, retryable], properties: {code: {type: string}, message: {type: string}, retryable: {type: boolean}, attemptToken: {type: string}}}
    RMStartSession: {type: object, additionalProperties: false, required: [schedulerId, modelId], oneOf: [{required: [contextSizeEstimate]}, {required: [bucketIdentity]}], properties: {schedulerId: {type: string, minLength: 1}, modelId: {$ref: '#/components/schemas/ModelId'}, contextSizeEstimate: {type: integer, minimum: 1}, bucketIdentity: {type: string, minLength: 1}}}
    RMSubmit: {type: object, additionalProperties: false, required: [requestId, attemptToken, inputReference], not: {required: [contextSizeEstimate, bucketIdentity]}, properties: {requestId: {type: string, minLength: 1}, attemptToken: {type: string, minLength: 1}, inputReference: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}, contextSizeEstimate: {type: integer, minimum: 1}, bucketIdentity: {type: string, minLength: 1}}}
    RMStop: {type: object, additionalProperties: false, properties: {reason: {type: string, minLength: 1}}}
    RMSession: {type: object, additionalProperties: false, required: [sessionToken, schedulerId, modelId, residencyGeneration], properties: {sessionToken: {type: string}, schedulerId: {type: string}, modelId: {$ref: '#/components/schemas/ModelId'}, residencyGeneration: {type: integer, minimum: 1}}}
    RMFailure: {type: object, additionalProperties: false, required: [code, message, retryable], properties: {code: {type: string}, message: {type: string}, retryable: {type: boolean}}}
    RMNullableFailure: {type: object, nullable: true, additionalProperties: false, required: [code, message, retryable], properties: {code: {type: string}, message: {type: string}, retryable: {type: boolean}}}
    RMSubmission: {type: object, additionalProperties: false, required: [accepted, requestId, attemptToken, sessionToken, residencyGeneration, backpressure], properties: {accepted: {type: boolean}, requestId: {type: string}, attemptToken: {type: string}, sessionToken: {type: string}, residencyGeneration: {type: integer, minimum: 1}, backpressure: {type: boolean}, failure: {$ref: '#/components/schemas/RMNullableFailure'}}}
    RMAck: {type: object, additionalProperties: false, required: [acknowledged], properties: {acknowledged: {type: boolean}}}
    RMCapacityProfile: {type: object, additionalProperties: false, required: [modelId, gpuUuid, artifactManifestHash, modelHash, runtimeIdentity, adapterIdentity, profileIdentity, optimalParallelism, memorySafeN, bufferCapacity, safetyReservePercent, rawSamples], properties: {modelId: {$ref: '#/components/schemas/ModelId'}, gpuUuid: {type: string}, artifactManifestHash: {type: string}, modelHash: {type: string}, runtimeIdentity: {type: string}, adapterIdentity: {type: string}, profileIdentity: {type: string}, optimalParallelism: {type: integer, minimum: 1}, memorySafeN: {type: integer, minimum: 1}, bufferCapacity: {type: integer, minimum: 1}, safetyReservePercent: {type: integer, minimum: 0, maximum: 100}, rawSamples: {type: array, items: {$ref: '#/components/schemas/Sample'}}, contextSize: {type: integer, minimum: 1, nullable: true}, bucketIdentity: {type: string, nullable: true}}}
    RMCapacity: {type: object, additionalProperties: false, required: [profile, executionSlots, bufferSlots, freeSlots], properties: {profile: {$ref: '#/components/schemas/RMCapacityProfile'}, executionSlots: {type: integer, minimum: 0}, bufferSlots: {type: integer, minimum: 0}, freeSlots: {type: integer, minimum: 0}}}
    RMProgressEvent: {type: object, additionalProperties: false, required: [sequence, completionSequence, kind, requestId, attemptToken, sessionToken, residencyGeneration, resultBase64, failure, timeOnGpuMs, gpuTimingComplete], properties: {sequence: {type: integer, minimum: 0}, completionSequence: {type: integer, minimum: 0}, kind: {type: string, enum: [buffered, admission, response_finished, failure, cancelled, session-invalidated]}, requestId: {type: string, nullable: true}, attemptToken: {type: string, nullable: true}, sessionToken: {type: string}, residencyGeneration: {type: integer, minimum: 1}, resultBase64: {type: string, nullable: true}, failure: {$ref: '#/components/schemas/RMNullableFailure'}, timeOnGpuMs: {type: integer, nullable: true, minimum: 0}, gpuTimingComplete: {type: boolean}}}
    RMError: {type: object, additionalProperties: false, required: [error], properties: {error: {$ref: '#/components/schemas/RMFailure'}}}
